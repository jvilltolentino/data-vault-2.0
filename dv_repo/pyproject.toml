[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "dv_module"
version = "0.0.1"
description = "This is a data vault 2.0 implementation"
authors = [
  { name = "Joseph Tolentino" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["dv_module"]
include = ["pyproject.toml", "dv_module/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["dv_module"]
force-sort-within-sections = true

